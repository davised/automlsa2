[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "automlsa2"
dynamic = ["version"]
description = "Automated Multi-Locus Sequence Analysis tool"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Edward Davis", email = "ed@cgrb.oregonstate.edu" }]
maintainers = [{ name = "Edward Davis", email = "ed@cgrb.oregonstate.edu" }]
requires-python = ">=3.10"
# External programs (BLAST+, MAFFT, IQ-TREE) are not on PyPI; install them
# with conda: see environment.yml.
dependencies = [
    "biopython>=1.80",
    "numpy>=1.23",
    "packaging>=22.0",
    "pandas>=1.5",
    "psutil>=5.9",
    "rich>=12.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
test = ["pytest", "hypothesis"]

[project.urls]
Homepage = "https://github.com/davised/automlsa2"
Issues = "https://github.com/davised/automlsa2/issues"

[project.scripts]
automlsa2 = "automlsa2.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "automlsa2.__version__.__version__" }

[tool.setuptools.packages.find]
include = ["automlsa2*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
skip-string-normalization = true

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
