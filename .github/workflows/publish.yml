# Publishes to PyPI when a GitHub release is published, using PyPI Trusted
# Publishing (no API tokens). The PyPI project must list this repository,
# this workflow file (publish.yml), and the environment "pypi" as a trusted
# publisher.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import ast; print(ast.parse(open('automlsa2/__version__.py').read()).body[0].value.value)")
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag $TAG does not match package version $version" >&2
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/automlsa2/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
